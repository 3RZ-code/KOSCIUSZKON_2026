{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKADEMIA</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="text-slate-200 min-h-screen">

    <nav class="border-b border-slate-800 bg-slate-950/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(20,184,166,0.5)]">
                    <svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <span class="text-xl font-extrabold tracking-tighter text-white">HACKA<span class="text-teal-400">DEMIA</span></span>
            </div>
            <div class="flex items-center gap-6 text-sm font-medium text-slate-400">
                <a href="{% url 'home' %}" class="hover:text-teal-400 transition-colors">Strona główna</a>
                <a href="{% url 'course_detail' 1 %}" class="hover:text-teal-400 transition-colors">Kursy</a>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <div id="ai-agent-widget" class="fixed bottom-6 right-6 z-50">
        <button id="ai-agent-toggle" class="w-16 h-16 rounded-full bg-purple-500 hover:bg-purple-400 text-white font-black shadow-[0_0_30px_rgba(168,85,247,0.45)] transition-all flex items-center justify-center">
            AI
        </button>

        <div id="ai-agent-panel" class="hidden w-96 max-w-[calc(100vw-2rem)] mt-4 glass rounded-3xl border border-purple-500/30 shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-800 bg-slate-950/80">
                <h3 class="text-white font-extrabold text-lg">Agent AI</h3>
                <p class="text-slate-400 text-sm">Wpisz temat, a agent wygeneruje kurs dostępny tylko w Twojej sesji.</p>
            </div>

            <div class="p-5">
                <label for="ai-course-topic" class="block text-sm font-bold text-slate-300 mb-2">Temat kursu</label>
                <textarea id="ai-course-topic" rows="4" maxlength="150" class="w-full rounded-2xl bg-slate-900 border border-slate-700 text-slate-200 p-4 outline-none focus:border-purple-500 transition-colors resize-none" placeholder="Np. Jak rozpoznać fałszywy SMS od kuriera?"></textarea>
                <p id="ai-agent-status" class="text-sm text-slate-400 mt-3 min-h-[24px]"></p>
                <button id="ai-generate-course-btn" class="w-full mt-4 py-3 bg-purple-500 hover:bg-purple-400 text-white font-bold rounded-xl transition-all">
                    Wygeneruj kurs
                </button>
            </div>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;

            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");

                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();

                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }

            return cookieValue;
        }

        const aiToggle = document.getElementById("ai-agent-toggle");
        const aiPanel = document.getElementById("ai-agent-panel");
        const aiButton = document.getElementById("ai-generate-course-btn");
        const aiTopic = document.getElementById("ai-course-topic");
        const aiStatus = document.getElementById("ai-agent-status");

        aiToggle.addEventListener("click", () => {
            aiPanel.classList.toggle("hidden");
        });

        aiButton.addEventListener("click", async () => {
            const topic = aiTopic.value.trim();

            if (!topic) {
                aiStatus.textContent = "Najpierw wpisz temat kursu.";
                aiStatus.className = "text-sm text-red-400 mt-3 min-h-[24px]";
                return;
            }

            aiButton.disabled = true;
            aiButton.textContent = "Generowanie...";
            aiStatus.textContent = "Agent przygotowuje kurs. To może potrwać kilka sekund.";
            aiStatus.className = "text-sm text-slate-400 mt-3 min-h-[24px]";

            try {
                const response = await fetch("{% url 'generate_ai_course' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: JSON.stringify({ topic })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Nie udało się wygenerować kursu.");
                }

                aiStatus.textContent = "Kurs został wygenerowany. Odświeżam stronę...";
                aiStatus.className = "text-sm text-green-400 mt-3 min-h-[24px]";

                setTimeout(() => {
                    window.location.reload();
                }, 700);
            } catch (error) {
                aiStatus.textContent = error.message;
                aiStatus.className = "text-sm text-red-400 mt-3 min-h-[24px]";
            } finally {
                aiButton.disabled = false;
                aiButton.textContent = "Wygeneruj kurs";
            }
        });
    </script>

    <script src="{% static 'js/cookies.js' %}"></script>
</body>
</html>
